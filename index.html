<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LookMeUp</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>
  <body>
    <div id="card" class="popup-card">
      <div class="card-header">
        <div class="title-group">
          <span id="word-title" class="word">LookMeUp</span>
          <span id="word-pos" class="pos-badge"></span>
        </div>
        <button id="close-btn" class="close-btn" title="Dismiss (Esc)">&times;</button>
      </div>
      <div id="card-body" class="card-body">
        <p class="hint">Highlight a word in any app and press <kbd>Ctrl+Alt+D</kbd></p>
      </div>
    </div>
  </body>
</html>
